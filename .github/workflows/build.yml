name: build

on:
  push:
  workflow_dispatch:

jobs:
  docker:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build docker image
        run: |
          docker build . -t luantiweb
          docker run --rm luantiweb ls -la /luanti-wasm/www
